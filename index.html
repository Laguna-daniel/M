<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>✨ Universo de Michell ✨</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background-color: #000;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .cosmic-hud {
            position: absolute;
            bottom: 25px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 20;
            pointer-events: none;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
        }

        .main-title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffd6e8, #c084fc, #ff99cc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(192,132,252,0.5);
            margin-bottom: 6px;
        }

        .sub-info {
            font-size: 0.65rem;
            letter-spacing: 2px;
            opacity: 0.6;
            font-weight: 300;
        }

        .premium-btn {
            position: absolute;
            bottom: 25px;
            left: 25px;
            z-index: 30;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.3rem;
            border: 1px solid rgba(255,150,200,0.4);
            transition: all 0.3s ease;
            pointer-events: auto;
            color: white;
        }

        .premium-btn:active {
            transform: scale(0.95);
            background: rgba(255,100,150,0.4);
            border-color: #ff99cc;
            box-shadow: 0 0 15px rgba(255,153,204,0.6);
        }

        .star-label-premium {
            position: absolute;
            z-index: 25;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: #fff;
            border: 1px solid rgba(255,153,204,0.5);
            border-left: 3px solid #ff66aa;
            border-right: 3px solid #b77cff;
            white-space: nowrap;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: monospace;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
        }

        .star-label-premium:active {
            transform: scale(0.96);
        }

        .elegant-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.92);
            opacity: 0;
            visibility: hidden;
            background: rgba(8, 5, 20, 0.96);
            backdrop-filter: blur(28px);
            border-radius: 32px;
            border: 1px solid rgba(255, 120, 180, 0.5);
            padding: 28px 24px;
            max-width: 340px;
            width: 85%;
            z-index: 200;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            text-align: center;
            box-shadow: 0 25px 45px rgba(0,0,0,0.8), 0 0 40px rgba(255,80,140,0.3);
        }

        .elegant-modal.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            visibility: visible;
        }

        .elegant-modal h3 {
            font-size: 1.6rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffb3d9, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }

        .elegant-modal p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e6d6ff;
            margin: 18px 0;
        }

        .elegant-modal button {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,150,200,0.5);
            padding: 10px 26px;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .elegant-modal button:active {
            background: #ff99cc;
            color: #1a0a2a;
        }

        @media (max-width: 600px) {
            .star-label-premium { font-size: 0.55rem; padding: 4px 12px; }
            .elegant-modal h3 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="premium-btn" id="musicBtn">🎧</div>

    <div class="cosmic-hud">
        <div class="main-title" id="dynamicTitle">🌀 HORIZONTE DE MICHELL 🌀</div>
        <div class="sub-info">TOCA LAS ESTRELLAS · EXPLORA EL COSMOS</div>
    </div>

    <div class="elegant-modal" id="cosmicModal">
        <h3 id="modalTitle">✨ Singularidad</h3>
        <p id="modalDesc">Mensaje desde el agujero negro...</p>
        <button id="closeModalBtn">CERRAR</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010005);
        scene.fog = new THREE.FogExp2(0x010005, 0.0003);

        const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.5, 1500);
        camera.position.set(0, 8, 130);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.3;
        container.appendChild(renderer.domElement);

        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.1, 0.4, 0.8);
        bloomPass.threshold = 0.05;
        bloomPass.strength = 0.85;
        bloomPass.radius = 0.7;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.rotateSpeed = 0.9;
        controls.zoomSpeed = 0.8;
        controls.enableZoom = true;
        controls.maxDistance = 380;
        controls.minDistance = 45;
        controls.target.set(0, 2, 0);

        // ========== AGUJERO NEGRO ==========
        const blackHoleCore = new THREE.Mesh(
            new THREE.SphereGeometry(3.5, 128, 128),
            new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x220033, emissiveIntensity: 0.5, metalness: 0.9 })
        );
        scene.add(blackHoleCore);

        const eventHorizon = new THREE.Mesh(
            new THREE.SphereGeometry(5, 64, 64),
            new THREE.MeshBasicMaterial({ color: 0xff44aa, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, side: THREE.BackSide })
        );
        scene.add(eventHorizon);

        // Disco de acreción
        const accretionCount = 2000;
        const accretionGeo = new THREE.BufferGeometry();
        const accretionPos = [];
        const accretionColors = [];
        for (let i = 0; i < accretionCount; i++) {
            const r = 6 + Math.random() * 5;
            const ang = Math.random() * Math.PI * 2;
            const yOff = (Math.random() - 0.5) * 1.5;
            accretionPos.push(Math.cos(ang) * r, yOff, Math.sin(ang) * r);
            const colR = 1.0, colG = 0.3 + Math.random()*0.3, colB = 0.6 + Math.random()*0.4;
            accretionColors.push(colR, colG, colB);
        }
        accretionGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(accretionPos), 3));
        accretionGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(accretionColors), 3));
        const accretionMat = new THREE.PointsMaterial({ size: 0.15, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending });
        const accretionDisk = new THREE.Points(accretionGeo, accretionMat);
        scene.add(accretionDisk);

        // ========== NEBULOSA ==========
        const gasCount = 3000;
        const gasGeo = new THREE.BufferGeometry();
        const gasPos = new Float32Array(gasCount * 3);
        const gasCol = new Float32Array(gasCount * 3);
        for (let i = 0; i < gasCount; i++) {
            const r = 50 + Math.pow(Math.random(), 1.6) * 100;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            gasPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
            gasPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.6;
            gasPos[i*3+2] = r * Math.cos(phi);
            gasCol[i*3] = 0.8 + Math.random()*0.2;
            gasCol[i*3+1] = 0.3 + Math.random()*0.3;
            gasCol[i*3+2] = 0.9 + Math.random()*0.1;
        }
        gasGeo.setAttribute('position', new THREE.BufferAttribute(gasPos, 3));
        gasGeo.setAttribute('color', new THREE.BufferAttribute(gasCol, 3));
        
        const glowTex = (() => {
            const c = document.createElement('canvas');
            c.width = 32; c.height = 32;
            const ctx = c.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.4, 'rgba(255,180,200,0.7)');
            grad.addColorStop(1, 'rgba(100,50,120,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(c);
        })();
        
        const gasMat = new THREE.PointsMaterial({ size: 2.2, map: glowTex, vertexColors: true, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending });
        const nebulaGas = new THREE.Points(gasGeo, gasMat);
        scene.add(nebulaGas);

        // ========== ESTRELLAS DE FONDO (MUY VISIBLES) ==========
        const starCount = 8000;
        const starGeoBg = new THREE.BufferGeometry();
        const starPosBg = new Float32Array(starCount * 3);
        const starColBg = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const r = 350 + Math.random() * 700;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            starPosBg[i*3] = r * Math.sin(phi) * Math.cos(theta);
            starPosBg[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.6;
            starPosBg[i*3+2] = r * Math.cos(phi);
            const bright = 0.7 + Math.random() * 0.5;
            starColBg[i*3] = bright;
            starColBg[i*3+1] = bright * 0.85;
            starColBg[i*3+2] = bright;
        }
        starGeoBg.setAttribute('position', new THREE.BufferAttribute(starPosBg, 3));
        starGeoBg.setAttribute('color', new THREE.BufferAttribute(starColBg, 3));
        const starBgMat = new THREE.PointsMaterial({ size: 0.65, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending });
        const starField = new THREE.Points(starGeoBg, starBgMat);
        scene.add(starField);
        
        // Estrellas cercanas extra brillantes
        const nearStarCount = 2000;
        const nearStarGeo = new THREE.BufferGeometry();
        const nearStarPos = [];
        for (let i = 0; i < nearStarCount; i++) {
            nearStarPos.push((Math.random() - 0.5) * 400, (Math.random() - 0.5) * 250, (Math.random() - 0.5) * 350 - 50);
        }
        nearStarGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(nearStarPos), 3));
        const nearStarMat = new THREE.PointsMaterial({ color: 0xffddbb, size: 0.4, transparent: true, blending: THREE.AdditiveBlending });
        const nearStarsObj = new THREE.Points(nearStarGeo, nearStarMat);
        scene.add(nearStarsObj);

        // ========== GUSTOS (SIN REPETIR CACAO) ==========
        const gustosData = [
            { nombre: "👩‍🍳 TÚ", emoji: "👩‍🍳", desc: " ¡Eres única,Eres tu sin forzar.", color: 0x88dd88, pos: { x: -38, y: 14, z: 30 } },
            { nombre: "🏐 Voleibol", emoji: "🏐", desc: "Voleibol + Natación 🏐🧜‍♀️ ¡Espectacular en ambos deportes!", color: 0x5dade2, pos: { x: -30, y: 22, z: -48 } },
            { nombre: "🍇 Uvas", emoji: "🍇", desc: "Uvas dulces 🍇 Como tú. ¡Suerte y prosperidad cósmica!", color: 0x9b59b6, pos: { x: 48, y: 12, z: 22 } },
            { nombre: "✨ TÚ SER", emoji: "✨", desc: "✨ Eres la reina. Brilla siempre como esta estrella.", color: 0xdd88aa, pos: { x: -44, y: -12, z: -40 } }
        ];

        const gustosStars = [];
        const labelsArray = [];

        gustosData.forEach((gusto, idx) => {
            const starMat = new THREE.MeshStandardMaterial({ color: gusto.color, emissive: gusto.color, emissiveIntensity: 0.7, metalness: 0.2 });
            const starMesh = new THREE.Mesh(new THREE.SphereGeometry(1.3, 64, 64), starMat);
            starMesh.position.set(gusto.pos.x, gusto.pos.y, gusto.pos.z);
            scene.add(starMesh);
            
            const haloGlow = new THREE.Mesh(
                new THREE.SphereGeometry(2.1, 32, 32),
                new THREE.MeshBasicMaterial({ color: gusto.color, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending })
            );
            starMesh.add(haloGlow);
            starMesh.userData = { halo: haloGlow, desc: gusto.desc, nombre: `${gusto.emoji} ${gusto.nombre}` };
            gustosStars.push(starMesh);
            
            const labelDiv = document.createElement('div');
            labelDiv.className = 'star-label-premium';
            labelDiv.innerHTML = `${gusto.emoji} ${gusto.nombre}`;
            document.body.appendChild(labelDiv);
            labelsArray.push({ element: labelDiv, mesh: starMesh });
            
            labelDiv.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal(`${gusto.emoji} ${gusto.nombre}`, gusto.desc);
            });
        });

        // ========== PLANETA MICHELL ==========
        const planetMat = new THREE.MeshStandardMaterial({ color: 0xdd88aa, emissive: 0xaa5588, emissiveIntensity: 0.35 });
        const michellPlanet = new THREE.Mesh(new THREE.SphereGeometry(2.8, 128, 128), planetMat);
        michellPlanet.position.set(28, -6, 48);
        scene.add(michellPlanet);
        
        const planetRing = new THREE.Mesh(
            new THREE.TorusGeometry(4.2, 0.22, 96, 200),
            new THREE.MeshStandardMaterial({ color: 0xffaacc, emissive: 0xff88aa, transparent: true, opacity: 0.7 })
        );
        planetRing.rotation.x = Math.PI / 2.2;
        michellPlanet.add(planetRing);
        
        const planetLabel = document.createElement('div');
        planetLabel.className = 'star-label-premium';
        planetLabel.innerHTML = '🪐 Planeta Michell 🍀';
        planetLabel.style.borderLeftColor = "#ff99cc";
        document.body.appendChild(planetLabel);
        
        planetLabel.addEventListener('click', () => {
            openModal("🌍 Planeta Michell", "Es un honor ir conociéndote. Me encanta descubrir lo que te gusta. Quiero seguir explorando este universo contigo ✨");
        });

        // ========== COMETA DE CHOCOLATE (BIEN VISIBLE) ==========
        const cometGroup = new THREE.Group();
        
        // Cuerpo principal brillante
        const cometBody = new THREE.Mesh(
            new THREE.SphereGeometry(1.1, 64, 64),
            new THREE.MeshStandardMaterial({ color: 0xdd8844, emissive: 0xff6633, emissiveIntensity: 0.8, metalness: 0.3 })
        );
        cometGroup.add(cometBody);
        
        // Núcleo interno más brillante
        const cometCore = new THREE.Mesh(
            new THREE.SphereGeometry(0.6, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0xff8844, emissiveIntensity: 1.0 })
        );
        cometGroup.add(cometCore);
        
        // Estela larga y visible
        const trailCount = 80;
        const trailGeoComet = new THREE.BufferGeometry();
        const trailVerts = [];
        for (let i = 0; i < trailCount; i++) {
            trailVerts.push(-i * 0.22, (Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4);
        }
        trailGeoComet.setAttribute('position', new THREE.BufferAttribute(new Float32Array(trailVerts), 3));
        const trailMatComet = new THREE.PointsMaterial({ color: 0xffaa66, size: 0.15, transparent: true, blending: THREE.AdditiveBlending });
        const cometTrail = new THREE.Points(trailGeoComet, trailMatComet);
        cometGroup.add(cometTrail);
        
        // Luz alrededor del cometa
        const cometLight = new THREE.PointLight(0xff8844, 0.8, 30);
        cometGroup.add(cometLight);
        
        cometGroup.position.set(-65, 22, -50);
        scene.add(cometGroup);
        
        const cometLabel = document.createElement('div');
        cometLabel.className = 'star-label-premium';
        cometLabel.innerHTML = '☄️ Cometa Chocolate 🍫';
        cometLabel.style.background = "rgba(80,40,20,0.95)";
        document.body.appendChild(cometLabel);
        
        cometLabel.addEventListener('click', () => {
            openModal("☄️ Cometa Chocolate", "¡Cometa especial! Este mensaje trae: Te mereces un montón de cariño. ¡Brillas como este cometa! 🍫✨");
        });

        // ========== ILUMINACIÓN ==========
        const ambientLight = new THREE.AmbientLight(0x221133, 0.45);
        scene.add(ambientLight);
        const redLight = new THREE.PointLight(0xff4488, 0.6);
        redLight.position.set(12, 8, 25);
        scene.add(redLight);
        const coreLight = new THREE.PointLight(0xff33aa, 0.9, 55);
        coreLight.position.set(0, 0, 0);
        scene.add(coreLight);

        // ========== ANIMACIÓN ==========
        let time = 0;
        
        function updateLabels() {
            const wHalf = window.innerWidth / 2;
            const hHalf = window.innerHeight / 2;
            
            labelsArray.forEach(item => {
                const vec = item.mesh.position.clone();
                vec.project(camera);
                if (vec.z < 1 && vec.z > -1) {
                    item.element.style.display = 'block';
                    item.element.style.left = `${(vec.x * wHalf) + wHalf}px`;
                    item.element.style.top = `${-(vec.y * hHalf) + hHalf}px`;
                    item.element.style.transform = 'translate(-50%, -50%)';
                } else {
                    item.element.style.display = 'none';
                }
            });
            
            const pVec = michellPlanet.position.clone();
            pVec.project(camera);
            if (pVec.z < 1 && pVec.z > -1) {
                planetLabel.style.display = 'block';
                planetLabel.style.left = `${(pVec.x * wHalf) + wHalf}px`;
                planetLabel.style.top = `${-(pVec.y * hHalf) + hHalf}px`;
                planetLabel.style.transform = 'translate(-50%, -50%)';
            } else { planetLabel.style.display = 'none'; }
            
            const cVec = cometGroup.position.clone();
            cVec.project(camera);
            if (cVec.z < 1 && cVec.z > -1) {
                cometLabel.style.display = 'block';
                cometLabel.style.left = `${(cVec.x * wHalf) + wHalf}px`;
                cometLabel.style.top = `${-(cVec.y * hHalf) + hHalf}px`;
                cometLabel.style.transform = 'translate(-50%, -50%)';
            } else { cometLabel.style.display = 'none'; }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            controls.update();
            
            nebulaGas.rotation.y = time * 0.04;
            starField.rotation.y = time * 0.002;
            accretionDisk.rotation.y += 0.018;
            
            gustosStars.forEach((star, i) => {
                const intensity = 0.6 + Math.sin(time * 3.5 + i) * 0.3;
                star.material.emissiveIntensity = intensity;
                if (star.userData.halo) {
                    const s = 1 + Math.sin(time * 4 + i) * 0.15;
                    star.userData.halo.scale.set(s, s, s);
                }
            });
            
            michellPlanet.position.y = -6 + Math.sin(time * 1.3) * 0.2;
            if (planetRing) planetRing.rotation.z += 0.012;
            
            // Movimiento del cometa (órbita visible)
            cometGroup.position.x = -65 + Math.sin(time * 0.5) * 18;
            cometGroup.position.y = 22 + Math.cos(time * 0.7) * 10;
            cometGroup.position.z = -50 + Math.sin(time * 0.9) * 15;
            
            // Rotación del cometa
            cometGroup.rotation.z = Math.sin(time * 2) * 0.3;
            
            // Pulso del agujero negro
            const pulse = 0.7 + Math.sin(time * 2.8) * 0.2;
            coreLight.intensity = pulse;
            eventHorizon.scale.set(pulse, pulse, pulse);
            
            updateLabels();
            effectComposer.render();
        }
        
        const modal = document.getElementById('cosmicModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const closeBtn = document.getElementById('closeModalBtn');
        
        function openModal(title, desc) {
            modalTitle.innerText = title;
            modalDesc.innerText = desc;
            modal.classList.add('active');
        }
        
        function closeModalFunc() {
            modal.classList.remove('active');
        }
        
        closeBtn.addEventListener('click', closeModalFunc);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModalFunc(); });
        
        const musicBtn = document.getElementById('musicBtn');
        let musicActive = false;
        musicBtn.addEventListener('click', () => {
            musicActive = !musicActive;
            musicBtn.innerHTML = musicActive ? '🎵' : '🎧';
        });
        
        const phrases = ["🌀 AGUJERO NEGRO", "🏐 VOLEIBOL", "🍇 UVAS", "👩‍🍳 TÚ", "☄️ COMETA"];
        let pIdx = 0;
        setInterval(() => {
            const el = document.getElementById('dynamicTitle');
            if (el) el.innerText = `✨ ${phrases[pIdx % phrases.length]} ✨`;
            pIdx++;
        }, 5500);
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effectComposer.setSize(window.innerWidth, window.innerHeight);
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
